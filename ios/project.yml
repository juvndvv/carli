name: Carli
options:
  bundleIdPrefix: dev.jotade
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: S5FFHKW385
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Carli:
    type: application
    platform: iOS
    sources:
      - path: Carli
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jotade.personal
        PRODUCT_NAME: Carli
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Carli/Info.plist
      properties:
        CFBundleDisplayName: carli
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [Geist-Variable.ttf]
        NSFaceIDUsageDescription: carli usa Face ID para desbloquear la app y proteger tus datos.
        ITSAppUsesNonExemptEncryption: false
  CarliTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CarliTests
    dependencies:
      - target: Carli
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jotade.personal.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Carli:
    build:
      targets:
        Carli: all
        CarliTests: [test]
    test:
      targets: [CarliTests]
