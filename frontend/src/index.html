  <style>
    .launch {
      --launch-bg: #FFFFFF;
      --launch-face: #0D0D0D;
      position: fixed;
      inset: 0;
      z-index: 1001;
      background: var(--launch-bg);
      transition: opacity 240ms ease-out;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .launch { --launch-bg: #212121; --launch-face: #FFFFFF; }
    }
    :root[data-theme="dark"] .launch { --launch-bg: #212121; --launch-face: #FFFFFF; }
    .launch-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 96px;
      height: 96px;
      margin: -48px 0 0 -48px;
    }
    .launch-mark svg { display: block; width: 100%; height: 100%; }
    .launch-face { fill: var(--launch-face); }
    .launch-eye { fill: var(--launch-bg); transform-box: fill-box; transform-origin: center; }
    .launch-word {
      position: absolute;
      top: calc(50% + 64px);
      left: 0;
      right: 0;
      text-align: center;
      color: var(--launch-face);
      font: 650 26px/32px ui-sans-serif, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
      letter-spacing: -0.03em;
      opacity: 0;
    }
    .launch-animated .launch-eye { animation: launch-blink 1100ms ease-in-out 200ms both; }
    .launch-animated .launch-word { animation: launch-rise 380ms ease-out 900ms both; }
    .launch-out { opacity: 0; pointer-events: none; }
    @keyframes launch-blink {
      0%, 18%, 36%, 58%, 76%, 100% { transform: scaleY(1); }
      27%, 67% { transform: scaleY(0.12); }
    }
    @keyframes launch-rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .launch-animated .launch-eye, .launch-animated .launch-word { animation: none; }
      .launch-animated .launch-word { opacity: 1; }
    }
  </style>
</head>
