name: personal-app

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-personal}
      POSTGRES_USER: ${DB_USERNAME:-personal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-personal}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.231.40.0/24}
