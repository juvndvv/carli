name: Backend

on:
  pull_request:
    paths:
      - backend/**
      - infra/**
      - compose.yaml
      - .github/workflows/backend.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - infra/**
      - compose.yaml
      - .github/workflows/backend.yml
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

env:
  PHP_VERSION: "8.4"
  PHP_EXTENSIONS: pdo_pgsql, pgsql, intl, bcmath, gmp, zip, pcntl

jobs:
  quality:
    name: Pint and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - run: vendor/bin/pint --test

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: personal
          POSTGRES_PASSWORD: personal
          POSTGRES_DB: personal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal -d personal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: personal
      DB_PASSWORD: personal
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - run: cp .env.example .env && php artisan key:generate

      - run: php artisan test --parallel

  promote:
    name: Promote to production
    needs: [quality, tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The server polls this branch (infra/systemd/carli-deploy.timer) and deploys
      # whatever it points at, so only commits that passed the jobs above reach it.
      # Fast-forward only, so a slower run of an older commit never moves it back.
      - run: |
          if git rev-parse --verify --quiet origin/production > /dev/null \
              && ! git merge-base --is-ancestor origin/production HEAD; then
            echo "production is ahead of $GITHUB_SHA; leaving it as is"
            exit 0
          fi
          git push origin "HEAD:refs/heads/production"
