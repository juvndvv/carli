<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* ============ TOKENS (ver docs/DESIGN-SYSTEM.md) · estilo inspirado en ChatGPT ============ */
:root{
  color-scheme: light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F4F4; --sidebar:#F9F9F9; --border:#E5E5E5;
  --text:#0D0D0D; --text-2:#5D5D5D; --text-3:#767676;
  --primary:#0D0D0D; --primary-hover:#333333; --primary-soft:#ECECEC; --on-primary:#FFFFFF;
  --positive:#0F7B4A; --positive-soft:#E6F4EC;
  --warning:#B45309; --warning-soft:#FDF1E1;
  --negative:#D92D20; --negative-soft:#FDECEA;
  --focus-ring:rgba(13,13,13,.18);
  --c1:#2A78D6; --c2:#EB6834; --c3:#1BAF7A; --c4:#EDA100; --c5:#E87BA4; --c6:#008300; --c7:#6250D6; --c8:#E34948;
  --shadow-1:none; --shadow-2:0 4px 24px rgb(0 0 0 / .10), 0 0 0 1px rgb(0 0 0 / .04);
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-xl:28px; --r-full:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#212121; --surface:#212121; --surface-2:#2F2F2F; --sidebar:#181818; --border:#383838;
    --text:#ECECEC; --text-2:#B4B4B4; --text-3:#8F8F8F;
    --primary:#FFFFFF; --primary-hover:#DADADA; --primary-soft:#2F2F2F; --on-primary:#0D0D0D;
    --positive:#4ADE80; --positive-soft:#1B3326; --warning:#FBBF24; --warning-soft:#3A2E12;
    --negative:#F87171; --negative-soft:#3D1F1F; --focus-ring:rgba(255,255,255,.25);
    --c1:#3987E5; --c2:#D95926; --c3:#199E70; --c4:#C98500; --c5:#D55181; --c6:#008300; --c7:#9085E9; --c8:#E66767;
    --shadow-1:none; --shadow-2:0 4px 24px rgb(0 0 0 / .5), 0 0 0 1px rgb(255 255 255 / .06);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
    --bg:#212121; --surface:#212121; --surface-2:#2F2F2F; --sidebar:#181818; --border:#383838;
    --text:#ECECEC; --text-2:#B4B4B4; --text-3:#8F8F8F;
    --primary:#FFFFFF; --primary-hover:#DADADA; --primary-soft:#2F2F2F; --on-primary:#0D0D0D;
    --positive:#4ADE80; --positive-soft:#1B3326; --warning:#FBBF24; --warning-soft:#3A2E12;
    --negative:#F87171; --negative-soft:#3D1F1F; --focus-ring:rgba(255,255,255,.25);
    --c1:#3987E5; --c2:#D95926; --c3:#199E70; --c4:#C98500; --c5:#D55181; --c6:#008300; --c7:#9085E9; --c8:#E66767;
    --shadow-1:none; --shadow-2:0 4px 24px rgb(0 0 0 / .5), 0 0 0 1px rgb(255 255 255 / .06);
}

/* ============ BASE ============ */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/22px ui-sans-serif,-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
a{color:var(--text);text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus-ring);border-radius:var(--r-md)}
svg.lucide{width:18px;height:18px;stroke-width:1.75;flex:none}
h1{font-size:22px;line-height:30px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:16px;line-height:24px;font-weight:600;margin:0}
.small{font-size:13px;line-height:18px}
.caption{font-size:12px;line-height:16px;font-weight:500;color:var(--text-3)}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.pos{color:var(--positive)} .neg{color:var(--negative)} .warn{color:var(--warning)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ============ SHELL ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:260px;flex:none;background:var(--sidebar);padding:12px 8px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:650}
.brand-mark{width:30px;height:30px;border-radius:999px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700}
.nav-section{margin:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--text);font-size:14px;cursor:pointer;border:0;background:none;width:100%;text-align:left;min-height:38px}
.nav-item:hover{background:var(--primary-soft)}
.nav-item.active{background:var(--primary-soft);color:var(--text);font-weight:500}
.nav-item.sub{padding-left:38px;min-height:34px;font-size:14px}
.nav-item.disabled{opacity:.55;cursor:default}
.nav-item.disabled:hover{background:none}
.nav-item .pill{margin-left:auto}
.mod-dot{width:22px;height:22px;display:grid;place-items:center;color:var(--text);flex:none}
.mod-dot svg.lucide{width:18px;height:18px}
.sidebar .spacer{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 32px;position:sticky;top:0;background:var(--bg);z-index:5}
.topbar .title{flex:1;min-width:0}
.topbar .crumb{font-size:13px;color:var(--text-3)}
.content{padding:8px 32px 48px;max-width:1160px;width:100%}
.bottomnav,.fab,.m-only{display:none}
@media (max-width:1023px){
  .sidebar{display:none}
  .topbar{padding:12px 16px}
  .content{padding:4px 16px 120px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
  .bottomnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--text-3);padding:6px 0;min-height:48px;cursor:pointer}
  .bottomnav button.active{color:var(--text)}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:80px;width:56px;height:56px;border-radius:999px;background:var(--primary);color:var(--on-primary);border:0;box-shadow:var(--shadow-2);z-index:21;cursor:pointer}
  .fab svg.lucide{width:24px;height:24px}
  .d-only{display:none!important}
  .m-only{display:initial}
}

/* ============ COMPONENTES ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-weight:500;cursor:pointer;transition:background .12s;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--on-primary)} .btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--surface);border-color:var(--border);color:var(--text)} .btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:none;color:var(--text)} .btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--negative);color:#fff}
.btn-sm{height:32px;padding:0 12px;font-size:14px}
.btn-icon{width:40px;padding:0}
.btn-sm.btn-icon{width:32px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1023px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3,.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g-2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stat .label{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.stat .value{font-size:24px;line-height:32px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.stat .delta{font-size:13px;margin-top:2px;display:flex;align-items:center;gap:4px}
.stat .delta svg.lucide{width:14px;height:14px}
.hero{font-size:36px;line-height:42px;font-weight:600;letter-spacing:-.02em}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.badge svg.lucide{width:12px;height:12px}
.badge.primary{background:var(--primary-soft);color:var(--text)}
.badge.positive{background:var(--positive-soft);color:var(--positive)}
.badge.warning{background:var(--warning-soft);color:var(--warning)}
.badge.negative{background:var(--negative-soft);color:var(--negative)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--primary);border-color:transparent;color:var(--on-primary);font-weight:500}
.chip svg.lucide{width:14px;height:14px}
.progress{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress>span{display:block;height:100%;border-radius:999px;background:var(--text)}
.progress.warning>span{background:var(--warning)}
.progress.negative>span{background:var(--negative)}
.progress.primary>span{background:var(--primary)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);min-height:56px}
.li:last-child{border-bottom:0}
.li .body{flex:1;min-width:0}
.li .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font-weight:550;text-align:right;white-space:nowrap}
.li.click{cursor:pointer;border-radius:12px} .li.click:hover{background:var(--surface-2)}
.ico{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--text)}
.ico.soft{background:var(--surface-2);color:var(--text-2)}
.day-head{display:flex;justify-content:space-between;padding:16px 4px 6px;font-size:13px;color:var(--text-3);font-weight:550}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;margin-bottom:16px}
.tab{padding:10px 12px;border:0;background:none;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;width:100%}
.seg button{flex:1;min-width:0;font-size:14px;border:0;background:none;height:34px;border-radius:999px;cursor:pointer;color:var(--text-2);font-weight:500}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:550;color:var(--text-2)}
.input{height:44px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:0 12px;color:var(--text);font:inherit;width:100%}
.input:focus{outline:none;border-color:var(--text-3);box-shadow:none}
.input-icon{position:relative}.input-icon svg.lucide{position:absolute;left:16px;top:15px;color:var(--text-3)}.input-icon .input{padding-left:44px;height:48px;border-radius:999px;background:var(--surface-2);border-color:transparent}
.money-input{font-size:40px;line-height:48px;font-weight:600;letter-spacing:-.02em;text-align:center;border:0;background:none;width:100%;color:var(--text)}
.switch{width:40px;height:24px;border-radius:999px;background:var(--border);position:relative;flex:none;cursor:pointer;border:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .12s}
.switch.on{background:var(--primary)} .switch.on::after{left:19px}
.empty{text-align:center;padding:32px 16px;color:var(--text-2)}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw{width:100%;height:56px;border-radius:10px;border:1px solid var(--border)}

/* ============ OVERLAYS ============ */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.scrim.open{display:flex}
.dialog{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-2);width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:20px;animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
@media (max-width:640px){.scrim{align-items:flex-end;padding:0}.dialog{border-radius:var(--r-xl) var(--r-xl) 0 0;max-width:none;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:var(--r-md);border:1px solid transparent;background:none;cursor:pointer;font-size:12px;color:var(--text-2)}
.cat-btn.on{background:var(--primary-soft);color:var(--text)} .cat-btn.on .ico{background:var(--primary);color:var(--on-primary)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px 10px 18px;border-radius:999px;display:none;align-items:center;gap:16px;z-index:60;box-shadow:var(--shadow-2)}
.toast.show{display:flex}
.toast button{background:none;border:0;color:var(--bg);text-decoration:underline;font-weight:600;cursor:pointer}
@media (max-width:1023px){.toast{bottom:150px}}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);border:0;border-radius:8px;padding:8px 10px;font-size:13px;z-index:70;display:none;white-space:nowrap}

/* ============ LOGIN ============ */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .card{width:100%;max-width:380px;padding:28px;border:0}

/* ============ CHARTS ============ */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--text-3);font-size:11px}
.chart .grid-line{stroke:var(--border);stroke-width:1}
.hit{cursor:default}
.hit:hover{opacity:.85}
@media (max-width:640px){.chart.scroll{overflow-x:auto}.chart.scroll svg{min-width:600px}}
.donut-wrap{display:grid;grid-template-columns:160px 1fr;gap:20px;align-items:center}
@media (max-width:420px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
</style>
</head>

/* ===================== CHARTS (SVG) ===================== */
function donut(items){
  const total = sum(items.map(i=>i.v)); const R=70, r=48, cx=80, cy=80; let a0=-Math.PI/2; const gap=0.02;
  const arcs = items.map(it=>{
    const a1 = a0 + (it.v/total)*Math.PI*2; const s=a0+gap/2, e=a1-gap/2; a0=a1;
    const large = (e-s)>Math.PI?1:0;
    const p=(ang,rad)=>[cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)];
    const [x1,y1]=p(s,R),[x2,y2]=p(e,R),[x3,y3]=p(e,r),[x4,y4]=p(s,r);
    return `<path class="hit" d="M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${large} 0 ${x4} ${y4}Z" fill="${it.c}" data-tip="${it.n}: ${fmt(it.v)} (${Math.round(it.v/total*100)} %)"/>`;
  }).join('');
  return `<div class="chart" style="width:160px"><svg viewBox="0 0 160 160" role="img" aria-label="Gasto por categoría">${arcs}
    <text x="80" y="76" text-anchor="middle" style="fill:var(--text-3);font-size:11px">Gastado</text>
    <text x="80" y="94" text-anchor="middle" class="num" style="fill:var(--text);font-size:15px;font-weight:650">${fmtK(total)}</text></svg></div>`;
}
function bars(){
  const W=640,H=220,pl=40,pb=24,pt=8; const max=450000; const cw=(W-pl)/12; const bw=Math.min(14,cw/3);
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let g=''; [0,100000,200000,300000,400000].forEach(v=>{g+=`<line class="grid-line" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v/100000} k€</text>`});
  const rb=(x,v,c,tip)=>{const h=H-pb-y(v); const rr=Math.min(4,h); return `<path class="hit" fill="${c}" data-tip="${tip}" d="M${x} ${H-pb} V${y(v)+rr} Q${x} ${y(v)} ${x+rr} ${y(v)} H${x+bw-rr} Q${x+bw} ${y(v)} ${x+bw} ${y(v)+rr} V${H-pb}Z"/>`;};
  let b=''; MONTHS.forEach((m,i)=>{const cx=pl+cw*i+cw/2; b+=rb(cx-bw-1,INC[i],'var(--c1)',`${m}: ingresos ${fmt(INC[i])}`)+rb(cx+1,EXP[i],'var(--c2)',`${m}: gastos ${fmt(EXP[i])}`)+`<text class="axis" x="${cx}" y="${H-6}" text-anchor="middle">${m}</text>`});
  return `<div class="chart scroll"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos 12 meses">${g}${b}</svg></div>`;
}
function line(data,h=220){
  const W=1100,H=h,pl=44,pb=22,pt=10; const min=Math.min(...data)*0.95,max=Math.max(...data)*1.03;
  const x=i=>pl+(W-pl-8)*i/(data.length-1), y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  let g=''; [min+(max-min)*.2,min+(max-min)*.6,min+(max-min)*.95].forEach(v=>{g+=`<line class="grid-line" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${(v/100000).toFixed(0)} k€</text>`});
  const dots=data.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="10" fill="transparent" class="hit" data-tip="${MONTHS[i]}: ${fmt(v)}"/><circle cx="${x(i)}" cy="${y(v)}" r="${i===data.length-1?4:0}" fill="var(--c1)" stroke="var(--surface)" stroke-width="2" pointer-events="none"/>`).join('');
  const labels=MONTHS.map((m,i)=>i%2===1?`<text class="axis" x="${x(i)}" y="${H-4}" text-anchor="middle">${m}</text>`:'').join('');
  return `<div class="chart scroll"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del patrimonio">${g}<polyline points="${pts}" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}</svg></div>`;
}

/* ===================== NAVEGACIÓN ===================== */
const FIN_NAV = [
  {r:'finanzas',n:'Resumen',i:'layout-dashboard'},
  {r:'finanzas/movimientos',n:'Movimientos',i:'list'},
  {r:'finanzas/cuentas',n:'Cuentas',i:'landmark'},
  {r:'finanzas/presupuestos',n:'Presupuestos',i:'gauge'},
  {r:'finanzas/recurrentes',n:'Recurrentes',i:'repeat'},
  {r:'finanzas/objetivos',n:'Objetivos',i:'target'},
  {r:'finanzas/deudas',n:'Deudas y compartidos',i:'users'},
];
const BOTTOM = [
  {r:'inicio',n:'Inicio',i:'house'},
  {r:'finanzas',n:'Resumen',i:'layout-dashboard'},
  {r:'finanzas/movimientos',n:'Movimientos',i:'list'},
  {r:'finanzas/presupuestos',n:'Presupuestos',i:'gauge'},
  {r:'finanzas/mas',n:'Más',i:'menu'},
];
function go(r){ location.hash = r; }
function route(){ return location.hash.replace(/^#/,'') || 'login'; }

function renderLogin(){
  $('#root').innerHTML = `<div class="login"><div class="card stack">
    <div class="row"><div class="brand-mark">P</div><div><div style="font-weight:650">Personal App</div><div class="small faint">Tu espacio privado</div></div></div>
    <div class="field"><label>Email</label><input class="input" type="email" value="juanda@ejemplo.com"></div>
    <div class="field"><label>Contraseña</label><input class="input" type="password" value="••••••••••"></div>
    <label class="row small muted" style="gap:8px"><input type="checkbox" checked> Mantener la sesión iniciada</label>
    <button class="btn btn-primary" onclick="go('inicio')">Entrar</button>
    <div class="small faint" style="text-align:center">Acceso privado · sin registro público</div>
  </div></div>`;
  lucide.createIcons();
}

function render(){
  const r = route();
  if (r==='login') return renderLogin();
  const s = (SCREENS[r]||SCREENS['inicio'])();
  const inFin = r.startsWith('finanzas');
  $('#root').innerHTML = `<div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">P</div>Personal App</div>
      <button class="nav-item ${r==='inicio'?'active':''}" onclick="go('inicio')">${icon('house')}Inicio</button>
      <div class="nav-section caption">Módulos</div>
      <button class="nav-item ${inFin&&false?'active':''}" onclick="go('finanzas')"><span class="mod-dot" style="--accent:#1BAF7A">${icon('wallet')}</span>Finanzas</button>
      ${FIN_NAV.map(n=>`<button class="nav-item sub ${r===n.r?'active':''}" onclick="go('${n.r}')">${n.n}</button>`).join('')}
      ${MODULES.filter(m=>!m.on).map(m=>`<button class="nav-item disabled" aria-disabled="true"><span class="mod-dot" style="--accent:${m.c}">${icon(m.i)}</span>${m.n}<span class="badge pill">Pronto</span></button>`).join('')}
      <div class="spacer"></div>
      <button class="nav-item ${r==='ds'?'active':''}" onclick="go('ds')">${icon('palette')}Design system</button>
      <button class="nav-item ${r==='ajustes'?'active':''}" onclick="go('ajustes')">${icon('settings')}Ajustes</button>
      <button class="nav-item" onclick="go('login')">${icon('log-out')}Cerrar sesión</button>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="title"><div class="crumb">${s.crumb||''}</div><h1>${s.title}</h1></div>
        ${s.actions||''}
        <button class="btn btn-ghost btn-icon" onclick="cycleTheme()" aria-label="Cambiar tema" title="Cambiar tema">${icon(themeIcon())}</button>
        <button class="btn btn-ghost btn-icon" aria-label="Notificaciones" style="position:relative">${icon('bell')}<span style="position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--negative);border:2px solid var(--bg)"></span></button>
      </header>
      <main class="content">${s.html}</main>
    </div>
  </div>
  <nav class="bottomnav">${BOTTOM.map(b=>`<button class="${r===b.r||(b.r==='finanzas/mas'&&['finanzas/cuentas','finanzas/recurrentes','finanzas/objetivos','finanzas/deudas','ajustes','ds','finanzas/mas'].includes(r))?'active':''}" onclick="go('${b.r}')">${icon(b.i)}${b.n}</button>`).join('')}</nav>
  <button class="fab" onclick="openTx()" aria-label="Nuevo movimiento">${icon('plus')}</button>`;
  lucide.createIcons();
  s.after && s.after();
  window.scrollTo(0,0);
}

/* ===================== NUEVO MOVIMIENTO ===================== */
let txType='expense', txCat='comida';
function openTx(){
  const cats = Object.entries(CATS).filter(([k])=> txType==='income' ? ['nomina','extra'].includes(k) : !['nomina','extra'].includes(k));
  $('#scrim').innerHTML = `<div class="dialog stack" onclick="event.stopPropagation()">
    <div class="row between"><h2>Nuevo movimiento</h2><button class="btn btn-ghost btn-icon btn-sm" onclick="closeTx()" aria-label="Cerrar">${icon('x')}</button></div>
    <div class="seg">${[['expense','Gasto'],['income','Ingreso'],['transfer','Transferencia']].map(([k,n])=>`<button class="${txType===k?'on':''}" onclick="txType='${k}';openTx()">${n}</button>`).join('')}</div>
    <input class="money-input num ${txType==='income'?'pos':''}" inputmode="decimal" value="${txType==='income'?'+':'−'}42,50 €" aria-label="Importe">
    ${txType==='transfer' ? `<div class="grid g-2"><div class="field"><label>Desde</label><select class="input">${ACCOUNTS.map(a=>`<option>${a.n}</option>`)}</select></div><div class="field"><label>Hacia</label><select class="input">${ACCOUNTS.map((a,i)=>`<option ${i===1?'selected':''}>${a.n}</option>`)}</select></div></div>` : `
    <div class="field"><label>Categoría</label><div class="cat-grid">${cats.map(([k,c])=>`<button class="cat-btn ${txCat===k?'on':''}" onclick="txCat='${k}';openTx()"><div class="ico" style="--accent:${c.c}">${icon(c.i)}</div>${c.n}</button>`).join('')}</div></div>
    <div class="grid g-2"><div class="field"><label>Cuenta</label><select class="input">${ACCOUNTS.map((a,i)=>`<option ${i===2?'selected':''}>${a.n}</option>`)}</select></div>
    <div class="field"><label>Fecha</label><div class="row" style="gap:6px"><button class="chip on">Hoy</button><button class="chip">Ayer</button><button class="chip">${icon('calendar')}</button></div></div></div>
    <div class="field"><label>Comercio o concepto</label><input class="input" value="Mercadona"><span class="small faint">${icon('sparkles','style="width:13px;height:13px;vertical-align:-2px"')} Sugerida: Alimentación (por usos anteriores)</span></div>
    <details><summary class="small" style="cursor:pointer;color:var(--primary);font-weight:550">Más opciones: etiquetas, nota, compartir, dividir</summary>
      <div class="stack" style="margin-top:12px">
        <div class="field"><label>Etiquetas</label><div class="row wrap" style="gap:6px"><span class="chip on">#casa ×</span><span class="chip">${icon('plus')}Añadir</span></div></div>
        <div class="field"><label>Nota</label><textarea class="input" style="height:72px;padding:10px 12px"></textarea></div>
        <div class="row between"><span>Gasto compartido</span><button class="switch" onclick="this.classList.toggle('on')" aria-label="Gasto compartido"></button></div>
        <div class="row between"><span>Dividir en varias categorías</span><button class="switch" onclick="this.classList.toggle('on')" aria-label="Dividir"></button></div>
      </div></details>`}
    <button class="btn btn-primary" style="height:48px" onclick="saveTx()">Guardar</button>
  </div>`;
  $('#scrim').classList.add('open');
  lucide.createIcons();
}
function closeTx(){ $('#scrim').classList.remove('open'); }
$('#scrim').addEventListener('click', closeTx);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeTx(); });
let toastT;
function saveTx(){ closeTx(); $('#toast-text').textContent='Movimiento guardado'; $('#toast').classList.add('show'); clearTimeout(toastT); toastT=setTimeout(hideToast,5000); }
function hideToast(){ $('#toast').classList.remove('show'); }

/* ===================== TEMA ===================== */
function getTheme(){ try{ return localStorage.getItem('pa-theme')||'system'; }catch(e){ return 'system'; } }
function applyTheme(t){ if(t==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); }
function setTheme(t){ try{ localStorage.setItem('pa-theme',t);}catch(e){} applyTheme(t); render(); }
function cycleTheme(){ const o=['light','dark','system']; setTheme(o[(o.indexOf(getTheme())+1)%3]); }
function themeIcon(){ return {light:'sun',dark:'moon',system:'monitor'}[getTheme()]; }
function syncThemeSeg(){ document.querySelectorAll('#theme-seg button').forEach(b=>b.classList.toggle('on', b.dataset.t===getTheme())); }

/* ===================== TOOLTIP ===================== */
const tip = $('#tip');
document.addEventListener('mouseover', e=>{ const el=e.target.closest('[data-tip]'); if(!el){tip.style.display='none';return;} tip.textContent=el.dataset.tip; tip.style.display='block'; });
document.addEventListener('mousemove', e=>{ if(tip.style.display==='block'){ tip.style.left=Math.min(e.clientX+12, innerWidth-tip.offsetWidth-8)+'px'; tip.style.top=(e.clientY-36)+'px'; } });

applyTheme(getTheme());
window.addEventListener('hashchange', render);
render();
</script>
