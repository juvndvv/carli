[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
ping.path = /fpm-ping
ping.response = pong
